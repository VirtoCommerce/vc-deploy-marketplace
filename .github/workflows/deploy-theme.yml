name: Cloud theme deployment

on:
  workflow_dispatch:
  push:
    paths:
      - 'theme/**'
    branches: 
      - 'vcmp-*'

env:
  # vc-build ships with rollForward=LatestMajor: on runners with .NET 11 it crashes in NukeBuild's type initializer.
  # Major keeps it on the .NET 10 runtime it targets (same as VirtoCommerce/.github actions/setup-vcbuild).
  DOTNET_ROLL_FORWARD: Major

jobs:
  gitops:
    strategy:
      matrix:
        store: [B2B-store]
    runs-on: ubuntu-24.04
    env:
      ARGO_APP_NAME: ${{ github.ref_name }}
      ARTIFACT_URL: ''

    steps:
      - uses: actions/checkout@v7
   
      - name: Install vc-build
        run: |
          dotnet tool install --global VirtoCommerce.GlobalTool
    
      - name: Get theme version
        id: theme-version
        run: |
            echo "ARTIFACT_URL=$(cat ./theme/artifact.json | jq -r '.URL')" >> $GITHUB_ENV

      - name: Update environment
        run: |
            export PARAMETER_NAME=$(echo "themes.${{ matrix.store }}" | xargs)
            export PARAMETER_VALUE=$(echo "${{ env.ARTIFACT_URL }}" | xargs)
            vc-build CloudEnvSetParameter -EnvironmentName ${{ env.ARGO_APP_NAME }} -CloudToken ${{ secrets.VCMP_PLATFORM_TOKEN }} -HelmParameters $PARAMETER_NAME=$PARAMETER_VALUE